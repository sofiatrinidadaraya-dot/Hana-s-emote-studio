<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hana Mai · Emote Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
/* Hana’s Emote Studio — Soft Magical UI (Hana Mai brand) */

:root {
  --bg: #fff0f5;
  --bg-soft: #ffe8f0;
  --surface: #ffffff;
  --surface-2: #fff7fa;

  --pink: #ff8fab;
  --pink-deep: #ff6b9d;
  --pink-soft: #ffd6e7;
  --pink-glow: rgba(255, 107, 157, 0.28);

  --blue: #7ec8e3;
  --blue-soft: #d4f0fa;
  --blue-deep: #5bb8d9;

  --lavender: #c9a0dc;
  --lavender-soft: #f0e4f7;
  --lavender-deep: #b48ed0;

  --gold: #e8c547;
  --gold-soft: #fff6d6;
  --gold-deep: #d4af37;

  --text: #5a4a62;
  --text-soft: #8b7a94;
  --text-muted: #b5a8c0;
  --border: #f5d6e4;
  --border-soft: #fce8f0;

  --success: #7dcea0;
  --warning: #f5b041;
  --danger: #f1948a;
  --info: #85c1e9;

  --radius: 20px;
  --radius-sm: 14px;
  --radius-xs: 10px;
  --radius-pill: 999px;

  --shadow: 0 4px 24px rgba(255, 107, 157, 0.1);
  --shadow-md: 0 8px 32px rgba(255, 107, 157, 0.14);
  --shadow-lg: 0 16px 48px rgba(255, 107, 157, 0.18);

  --font: 'Nunito', system-ui, -apple-system, sans-serif;
  --font-display: 'Quicksand', 'Nunito', sans-serif;
  --sidebar-w: 272px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 15px; -webkit-text-size-adjust: 100%; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.55;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 10% 0%, rgba(255, 182, 210, 0.45) 0%, transparent 55%),
    radial-gradient(ellipse 60% 40% at 95% 10%, rgba(180, 220, 245, 0.4) 0%, transparent 50%),
    radial-gradient(ellipse 50% 40% at 80% 90%, rgba(210, 180, 230, 0.3) 0%, transparent 50%),
    radial-gradient(ellipse 40% 30% at 5% 80%, rgba(255, 220, 160, 0.2) 0%, transparent 45%);
  pointer-events: none;
  z-index: 0;
}

#app {
  display: flex;
  min-height: 100vh;
  position: relative;
  z-index: 1;
}

/* SIDEBAR */
.sidebar {
  width: var(--sidebar-w);
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-right: 1px solid var(--border-soft);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 100;
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 4px 0 24px rgba(255, 107, 157, 0.06);
}

.sidebar-header {
  padding: 1.35rem 1.15rem 1.1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border-soft);
}

.logo {
  display: flex;
  align-items: center;
  gap: 0.7rem;
}

.logo-mark {
  width: 48px;
  height: 48px;
  border-radius: 16px;
  background: linear-gradient(145deg, var(--pink-soft), var(--blue-soft));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.55rem;
  box-shadow: 0 4px 14px var(--pink-glow);
  flex-shrink: 0;
}

.logo-text {
  display: flex;
  flex-direction: column;
  line-height: 1.1;
}

.logo-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.2rem;
  background: linear-gradient(120deg, var(--pink-deep), #ff8fab 55%, var(--blue));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.logo-sub {
  font-size: 0.7rem;
  color: var(--text-soft);
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.nav {
  flex: 1;
  padding: 1rem 0.85rem;
  display: flex;
  flex-direction: column;
  gap: 0.28rem;
  overflow-y: auto;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.72rem 1rem;
  border: none;
  background: transparent;
  border-radius: var(--radius-sm);
  font-family: var(--font);
  font-size: 0.92rem;
  font-weight: 600;
  color: var(--text-soft);
  cursor: pointer;
  transition: all 0.2s ease;
  text-align: left;
  width: 100%;
}

.nav-item:hover {
  background: var(--pink-soft);
  color: var(--pink-deep);
}

.nav-item.active {
  background: linear-gradient(135deg, var(--pink-soft) 0%, var(--blue-soft) 100%);
  color: var(--pink-deep);
  box-shadow: var(--shadow);
}

.nav-icon {
  font-size: 1.18rem;
  width: 1.5rem;
  text-align: center;
  line-height: 1;
}

.sidebar-footer {
  padding: 1rem 1.15rem;
  border-top: 1px solid var(--border-soft);
  font-size: 0.72rem;
  color: var(--text-muted);
}

/* MAIN */
.main {
  flex: 1;
  margin-left: var(--sidebar-w);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1rem 1.5rem;
  background: rgba(255, 255, 255, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border-soft);
  position: sticky;
  top: 0;
  z-index: 50;
}

.topbar h1 {
  font-family: var(--font-display);
  font-size: 1.32rem;
  font-weight: 700;
  color: var(--text);
  flex: 1;
}

.topbar-actions { display: flex; gap: 0.5rem; }

.content {
  flex: 1;
  padding: 1.5rem;
  max-width: 1240px;
  width: 100%;
  margin: 0 auto;
}

/* BUTTONS — fully rounded */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  padding: 0.6rem 1.25rem;
  border: 2px solid transparent;
  border-radius: var(--radius-pill);
  font-family: var(--font);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
  line-height: 1.2;
}

.btn-primary {
  background: linear-gradient(135deg, var(--pink-deep) 0%, #ff8fab 100%);
  color: white;
  box-shadow: 0 4px 16px var(--pink-glow);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(255, 107, 157, 0.38);
}

.btn-secondary {
  background: var(--surface);
  color: var(--pink-deep);
  border-color: var(--pink-soft);
  box-shadow: 0 2px 8px rgba(255, 107, 157, 0.08);
}

.btn-secondary:hover {
  background: var(--pink-soft);
  border-color: var(--pink);
}

.btn-ghost {
  background: transparent;
  color: var(--text-soft);
  border-color: var(--border);
}

.btn-ghost:hover {
  background: var(--surface-2);
  color: var(--text);
}

.btn-danger {
  background: #fff0ee;
  color: #d35d5d;
  border-color: #f5c6c2;
}

.btn-danger:hover { background: #fde8e6; }

.btn-sm {
  padding: 0.4rem 0.9rem;
  font-size: 0.8rem;
}

.btn-icon {
  width: 2.4rem;
  height: 2.4rem;
  border: none;
  background: transparent;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.15rem;
  color: var(--text-soft);
  transition: all 0.2s;
}

.btn-icon:hover {
  background: var(--pink-soft);
  color: var(--pink-deep);
}

.mobile-only { display: none; }

/* CARDS */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--border-soft);
  padding: 1.25rem;
  transition: all 0.25s ease;
}

.card:hover { box-shadow: var(--shadow-md); }

.card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 0.75rem;
  margin-bottom: 0.75rem;
}

.card-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.05rem;
  color: var(--text);
}

.card-subtitle {
  font-size: 0.8rem;
  color: var(--text-muted);
  margin-top: 0.2rem;
}

.grid { display: grid; gap: 1.15rem; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
  gap: 1rem;
  margin-bottom: 1.5rem;
}

.stat-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 1.1rem 1.15rem;
  border: 1px solid var(--border-soft);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
  position: relative;
  overflow: hidden;
}

.stat-card::after {
  content: '';
  position: absolute;
  top: -10px; right: -10px;
  width: 70px; height: 70px;
  background: radial-gradient(circle, var(--pink-soft) 0%, transparent 70%);
  opacity: 0.7;
  pointer-events: none;
}

.stat-card .stat-label {
  font-size: 0.76rem;
  color: var(--text-soft);
  font-weight: 600;
}

.stat-card .stat-value {
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--pink-deep);
}

.stat-card .stat-extra {
  font-size: 0.7rem;
  color: var(--text-muted);
}

/* BADGES */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 0.22rem 0.68rem;
  border-radius: var(--radius-pill);
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  border: 1px solid transparent;
}

.badge-idea { background: var(--lavender-soft); color: var(--lavender-deep); border-color: #e8d4f0; }
.badge-planificacion { background: var(--blue-soft); color: var(--blue-deep); border-color: #b8e4f2; }
.badge-produccion { background: var(--gold-soft); color: #c49a1a; border-color: #f0e0a0; }
.badge-revision { background: #e8f8ef; color: #2e8b57; border-color: #c8ebd8; }
.badge-preparacion { background: #e0f7fa; color: #00838f; border-color: #b2ebf2; }
.badge-publicado { background: var(--pink-soft); color: var(--pink-deep); border-color: #ffc2d4; }
.badge-archivado { background: #f0eef2; color: #7a7080; border-color: #e0dce4; }

.badge-emote-idea { background: var(--lavender-soft); color: var(--lavender-deep); }
.badge-emote-diseno { background: #e8eaf6; color: #5c6bc0; }
.badge-emote-aprobado { background: #e0f2f1; color: #00897b; }
.badge-emote-boceto { background: var(--gold-soft); color: #c49a1a; }
.badge-emote-lineart { background: var(--pink-soft); color: var(--pink-deep); }
.badge-emote-color { background: var(--blue-soft); color: var(--blue-deep); }
.badge-emote-animacion { background: #f3e5f5; color: #9c27b0; }
.badge-emote-revision { background: #e8f5e9; color: #43a047; }
.badge-emote-exportacion { background: #fff3e0; color: #ef6c00; }
.badge-emote-terminado {
  background: linear-gradient(135deg, #d4f5e0, #c8eef5);
  color: #1b7a4a;
  border-color: #a8e0c0;
}

/* PROGRESS */
.progress-bar {
  height: 8px;
  background: var(--pink-soft);
  border-radius: var(--radius-pill);
  overflow: hidden;
  margin-top: 0.5rem;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--pink-deep), var(--blue));
  border-radius: var(--radius-pill);
  transition: width 0.45s cubic-bezier(0.4, 0, 0.2, 1);
}

.progress-label {
  display: flex;
  justify-content: space-between;
  font-size: 0.72rem;
  color: var(--text-soft);
  margin-top: 0.28rem;
}

/* FORMS */
.form-group { margin-bottom: 1rem; }

.form-group label {
  display: block;
  font-size: 0.84rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 0.38rem;
}

.form-group label .required { color: var(--pink-deep); }

input[type="text"],
input[type="number"],
input[type="date"],
input[type="url"],
input[type="search"],
select,
textarea {
  width: 100%;
  padding: 0.68rem 1rem;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: var(--font);
  font-size: 0.95rem;
  color: var(--text);
  background: var(--surface);
  transition: border-color 0.2s, box-shadow 0.2s;
}

input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--pink);
  box-shadow: 0 0 0 4px var(--pink-glow);
}

textarea { min-height: 88px; resize: vertical; }

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}

.form-hint {
  font-size: 0.74rem;
  color: var(--text-muted);
  margin-top: 0.28rem;
}

/* CHECKLIST */
.checklist { list-style: none; }

.checklist-item {
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
  padding: 0.72rem 0.55rem;
  border-bottom: 1px solid var(--border-soft);
  transition: background 0.15s;
  border-radius: var(--radius-xs);
}

.checklist-item:hover { background: var(--surface-2); }
.checklist-item:last-child { border-bottom: none; }
.checklist-item.done { opacity: 0.6; }
.checklist-item.done .task-text {
  text-decoration: line-through;
  color: var(--text-muted);
}

.checkbox {
  width: 1.28rem;
  height: 1.28rem;
  border: 2px solid var(--pink);
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 0.08rem;
  background: white;
  transition: all 0.2s;
  font-size: 0.72rem;
  color: white;
}

.checkbox.checked {
  background: var(--pink-deep);
  border-color: var(--pink-deep);
}

.task-content { flex: 1; min-width: 0; }
.task-text { font-weight: 600; font-size: 0.9rem; }
.task-meta { font-size: 0.74rem; color: var(--text-muted); margin-top: 0.12rem; }

/* EMOTE CARDS */
.emote-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(248px, 1fr));
  gap: 1.05rem;
}

.emote-card {
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--border-soft);
  box-shadow: var(--shadow);
  overflow: hidden;
  transition: all 0.25s ease;
  cursor: pointer;
}

.emote-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-md);
  border-color: var(--pink-soft);
}

.emote-card-header {
  padding: 1rem 1.05rem 0.45rem;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.emote-card-body { padding: 0 1.05rem 1.05rem; }

.emote-name { font-weight: 700; font-size: 0.95rem; }
.emote-id { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; }

.emote-desc {
  font-size: 0.8rem;
  color: var(--text-soft);
  margin: 0.4rem 0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* EMPTY */
.empty-state {
  text-align: center;
  padding: 3rem 1.5rem;
  color: var(--text-soft);
}

.empty-state .empty-icon {
  font-size: 3.2rem;
  margin-bottom: 0.75rem;
  filter: drop-shadow(0 4px 10px rgba(255, 107, 157, 0.22));
}

.empty-state h3 {
  font-family: var(--font-display);
  font-size: 1.2rem;
  margin-bottom: 0.4rem;
  color: var(--text);
}

.empty-state p {
  font-size: 0.9rem;
  max-width: 320px;
  margin: 0 auto 1.2rem;
}

/* MODAL */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(90, 74, 98, 0.4);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 1rem;
}

.modal-overlay.hidden { display: none; }

.modal {
  background: var(--surface);
  border-radius: 28px;
  width: 100%;
  max-width: 540px;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-lg);
  animation: modalIn 0.28s cubic-bezier(0.34, 1.2, 0.64, 1);
  border: 1px solid var(--border-soft);
}

@keyframes modalIn {
  from { opacity: 0; transform: translateY(20px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.15rem 1.35rem;
  border-bottom: 1px solid var(--border-soft);
}

.modal-header h2 {
  font-family: var(--font-display);
  font-size: 1.12rem;
  font-weight: 700;
}

.modal-body {
  padding: 1.25rem 1.35rem;
  overflow-y: auto;
  flex: 1;
}

.modal-footer {
  padding: 1rem 1.35rem;
  border-top: 1px solid var(--border-soft);
  display: flex;
  justify-content: flex-end;
  gap: 0.5rem;
  flex-wrap: wrap;
}

.modal.wide { max-width: 680px; }

/* TOAST */
#toast-container {
  position: fixed;
  bottom: 1.5rem;
  right: 1.5rem;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.toast {
  background: var(--surface);
  border-radius: var(--radius-sm);
  padding: 0.88rem 1.15rem;
  box-shadow: var(--shadow-md);
  border-left: 4px solid var(--pink-deep);
  font-size: 0.9rem;
  font-weight: 600;
  animation: toastIn 0.3s ease;
  max-width: 340px;
}

.toast.success { border-left-color: var(--success); }
.toast.error { border-left-color: var(--danger); }
.toast.info { border-left-color: var(--info); }

@keyframes toastIn {
  from { opacity: 0; transform: translateX(24px); }
  to { opacity: 1; transform: translateX(0); }
}

/* TABS */
.tabs {
  display: flex;
  gap: 0.2rem;
  border-bottom: 2px solid var(--border-soft);
  margin-bottom: 1.25rem;
  overflow-x: auto;
  scrollbar-width: none;
}

.tabs::-webkit-scrollbar { display: none; }

.tab {
  padding: 0.62rem 1rem;
  border: none;
  background: transparent;
  font-family: var(--font);
  font-weight: 700;
  font-size: 0.88rem;
  color: var(--text-soft);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  white-space: nowrap;
  transition: all 0.2s;
  border-radius: var(--radius-xs) var(--radius-xs) 0 0;
}

.tab:hover {
  color: var(--pink-deep);
  background: var(--pink-soft);
}

.tab.active {
  color: var(--pink-deep);
  border-bottom-color: var(--pink-deep);
}

/* FILTERS */
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 0.45rem;
  margin-bottom: 1.2rem;
  align-items: center;
}

.filter-chip {
  padding: 0.38rem 0.9rem;
  border-radius: var(--radius-pill);
  border: 2px solid var(--border);
  background: var(--surface);
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-soft);
  cursor: pointer;
  transition: all 0.2s;
}

.filter-chip:hover,
.filter-chip.active {
  background: var(--pink-soft);
  border-color: var(--pink);
  color: var(--pink-deep);
}

.search-input {
  flex: 1;
  min-width: 150px;
  max-width: 250px;
}

/* PROJECT HEADER */
.project-header {
  background: linear-gradient(135deg, var(--pink-soft) 0%, var(--blue-soft) 55%, var(--lavender-soft) 100%);
  border-radius: 24px;
  padding: 1.45rem 1.5rem;
  margin-bottom: 1.4rem;
  border: 1px solid var(--border-soft);
  box-shadow: var(--shadow);
}

.project-header h2 {
  font-family: var(--font-display);
  font-size: 1.45rem;
  margin-bottom: 0.25rem;
}

.project-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 0.55rem 1.3rem;
  font-size: 0.84rem;

    if (!d) return '—';

    return `${day}/${m}/${y}`;
  }

  function formatMoney(n) {
    if (n == null || isNaN(n)) return '—';
    return `$${Number(n).toFixed(2)}`;
  }

  function toast(msg, type = 'info') {
    const container = document.getElementById('toast-container');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    container.appendChild(el);
    setTimeout(() => {
      el.style.opacity = '0';
      el.style.transform = 'translateX(30px)';
      el.style.transition = 'all 0.3s';
      setTimeout(() => el.remove(), 300);

  }

  function confirmAction(message) {
    return window.confirm(message);
  }

  // ========== STORAGE ==========
  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        projects: state.projects,
        templates: state.templates,
        resources: state.resources,
        clients: state.clients,
        payments: state.payments,
        settings: state.settings
      }));
      document.getElementById('storage-status').textContent = '💾 Guardado · ' + new Date().toLocaleTimeString('es');
    } catch (e) {
      toast('Error al guardar. ¿Espacio lleno?', 'error');
      console.error(e);
    }
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        state.projects = data.projects || [];
        state.templates = data.templates && data.templates.length ? data.templates : [DEFAULT_TEMPLATE];
        state.resources = data.resources || [];
        state.clients = data.clients || [];
        state.payments = data.payments || [];
        state.settings = { ...state.settings, ...(data.settings || {}) };
      } else {
        seedExampleProject();
        save();
      }
    } catch (e) {
      console.error('Error loading data', e);
      seedExampleProject();
    }
  }

  function exportJSON() {
    const data = {
      version: 1,
      exportedAt: new Date().toISOString(),
      projects: state.projects,
      templates: state.templates,
      resources: state.resources,
      clients: state.clients,
      payments: state.payments,
      settings: state.settings
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `hana-emote-studio-backup-${today()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast('Copia de seguridad descargada', 'success');
  }

  function importJSON(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (!data.projects) throw new Error('Formato inválido');
        if (!confirmAction('¿Importar esta copia? Se reemplazarán los datos actuales.')) return;
        state.projects = data.projects || [];
        state.templates = data.templates || [DEFAULT_TEMPLATE];
        state.resources = data.resources || [];
        state.clients = data.clients || [];
        state.payments = data.payments || [];
        state.settings = { ...state.settings, ...(data.settings || {}) };
        save();
        render();
        toast('Datos importados correctamente', 'success');
      } catch (err) {
        toast('Archivo JSON inválido', 'error');
      }
    };
    reader.readAsText(file);
  }

    if (idx < 0) return 0;
    // For static, skip animation
    const total = emote.type === 'estatica' ? 9 : 10;
    return Math.round((idx / (total - 1)) * 100);
  }

  function calcProjectProgress(project) {
    if (!project.emotes || project.emotes.length === 0) return 0;
    const sum = project.emotes.reduce((acc, e) => acc + calcEmoteProgress(e), 0);
    return Math.round(sum / project.emotes.length);
  }

  function countByStatus(projects, status) {
    return projects.filter(p => p.status === status).length;
  }

  function getActiveProjects() {
    return state.projects.filter(p => p.status !== 'archivado' && p.status !== 'publicado');
  }

  function getFinishedEmotesCount() {
    return state.projects.reduce((acc, p) => acc + (p.emotes || []).filter(e => e.state === 'terminado').length, 0);
  }

  function getInProgressEmotesCount() {
    return state.projects.reduce((acc, p) => acc + (p.emotes || []).filter(e => e.state !== 'terminado' && e.state !== 'idea').length, 0);
  }

  function getPublishedCount() {
    return state.projects.filter(p => p.status === 'publicado').length;
  }

  function getTotalEstimatedIncome() {
    return state.projects.reduce((acc, p) => {
      const b = p.budget || {};
      return acc + (b.grossEstimated || (b.pricePerPack || 0) * (b.slotsTotal || 0));
    }, 0);
  }

  function getAvailableSlots() {
    return state.projects.reduce((acc, p) => {
      const b = p.budget || {};
      const total = b.slotsTotal || p.slotsTotal || 0;
      const sold = b.slotsSold || p.slotsSold || 0;
      const reserved = b.slotsReserved || p.slotsReserved || 0;
      return acc + Math.max(0, total - sold - reserved);
    }, 0);
  }

  function getReservedSlots() {
    return state.projects.reduce((acc, p) => acc + ((p.budget && p.budget.slotsReserved) || p.slotsReserved || 0), 0);
  }

    const label = PROJECT_STATES.find(s => s.id === status)?.label || status;
    return `<span class="badge ${map[status] || ''}">${label}</span>`;

      idea: 'badge-emote-idea',
      diseno_por_definir: 'badge-emote-diseno',
      diseno_aprobado: 'badge-emote-aprobado',
      boceto: 'badge-emote-boceto',
      lineart: 'badge-emote-lineart',
      color: 'badge-emote-color',
      animacion: 'badge-emote-animacion',
      revision: 'badge-emote-revision',
      exportacion: 'badge-emote-exportacion',
      terminado: 'badge-emote-terminado'
    };
    const label = EMOTE_STATES.find(s => s.id === stateId)?.label || stateId;
    return `<span class="badge ${map[stateId] || ''}">${label}</span>`;

      return `<option value="${s.id}" ${emote.state === s.id ? 'selected' : ''}>${s.label}</option>`;

  const PAYMENT_STATUSES = [
    { id: 'pendiente', label: 'Pendiente' },
    { id: 'parcial', label: 'Parcial' },
    { id: 'pagado', label: 'Pagado' },
    { id: 'atrasado', label: 'Atrasado' },
    { id: 'cancelado', label: 'Cancelado' }
  ];

  function getPaymentsForClient(clientId) {
    return (state.payments || []).filter(pay => pay.clientId === clientId);
  }

  function getPaymentsForProject(projectId) {
    return (state.payments || []).filter(pay => pay.projectId === projectId);
  }

  function paymentStatusBadge(status) {
    const map = {
      pendiente: 'badge-planificacion',
      parcial: 'badge-produccion',
      pagado: 'badge-revision',
      atrasado: 'badge-publicado',
      cancelado: 'badge-archivado'
    };
    const label = PAYMENT_STATUSES.find(s => s.id === status)?.label || status;
    return `<span class="badge ${map[status] || ''}">${label}</span>`;
  }

  function calcPaymentProgress(pay) {
    const total = Number(pay.totalAmount) || 0;
    const paid = Number(pay.paidAmount) || 0;
    if (total <= 0) return pay.status === 'pagado' ? 100 : 0;
    return Math.min(100, Math.round((paid / total) * 100));
  }

  function getDueReminders() {
    const todayStr = today();
    const reminders = [];
    (state.payments || []).forEach(pay => {
      if (pay.status === 'pagado' || pay.status === 'cancelado') return;
      (pay.installments || []).forEach((inst, idx) => {
        if (inst.paid) return;
        if (inst.dueDate && inst.dueDate <= todayStr) {
          reminders.push({
            paymentId: pay.id,
            installmentIndex: idx,
            clientId: pay.clientId,
            projectId: pay.projectId,
            label: pay.label || 'Pago',
            amount: inst.amount,
            dueDate: inst.dueDate,
            overdue: inst.dueDate < todayStr
          });
        }
      });
      // single payment due
      if (pay.mode === 'unico' && pay.dueDate && pay.dueDate <= todayStr && pay.status !== 'pagado') {
        reminders.push({
          paymentId: pay.id,
          installmentIndex: null,
          clientId: pay.clientId,
          projectId: pay.projectId,
          label: pay.label || 'Pago único',
          amount: pay.totalAmount,
          dueDate: pay.dueDate,
          overdue: pay.dueDate < todayStr
        });
      }
    });
    return reminders;
  }

  function renderPayments() {
    const filter = state.paymentFilter || 'all';
    let list = [...(state.payments || [])];
    if (filter !== 'all') list = list.filter(p => p.status === filter);

    const reminders = getDueReminders();

    let html = '';
    if (reminders.length) {
      html += `
        <div class="card mb-2" style="border-color:var(--pink);background:linear-gradient(135deg,var(--pink-soft),var(--gold-soft))">

            ${reminders.slice(0, 8).map(r => {
              const client = state.clients.find(c => c.id === r.clientId);
              return `

                  <span>${r.overdue ? '🔴' : '🟡'}</span>

                  <button class="btn btn-sm btn-primary" data-action="mark-installment-paid" data-id="${r.paymentId}" data-idx="${r.installmentIndex ?? ''}">Marcar cobrado</button>
                </div>`;
            }).join('')}
          </div>
        </div>`;
    }

    html += `
      <div class="filters">
        <button class="filter-chip ${filter === 'all' ? 'active' : ''}" data-action="filter-payments" data-filter="all">Todos</button>
        ${PAYMENT_STATUSES.map(s => `

      </div>
    `;

    if (list.length === 0) {
      html += `
        <div class="empty-state card">
          <div class="empty-icon">💳</div>
          <h3>Sin pagos registrados</h3>
          <p>Registra cobros de una sola vez o en cuotas, y activa recordatorios de fechas de pago.</p>
          <button class="btn btn-primary" data-action="add-payment">Registrar pago</button>
        </div>`;
    } else {
      html += `<div class="grid grid-2">`;
      list.forEach(pay => {
        const client = state.clients.find(c => c.id === pay.clientId);
        const project = state.projects.find(pr => pr.id === pay.projectId);
        const prog = calcPaymentProgress(pay);
        html += `
          <div class="card">
            <div class="card-header">
              <div>
                <div class="card-title">${escapeHtml(pay.label || 'Pago')}</div>
                <div class="card-subtitle">${escapeHtml(client?.name || 'Sin cliente')}${project ? ' · ' + escapeHtml(project.name) : ''}</div>

              ${paymentStatusBadge(pay.status)}
            </div>
            <div class="text-sm">
              <strong>${formatMoney(pay.paidAmount || 0)}</strong>
              <span class="text-soft"> / ${formatMoney(pay.totalAmount)}</span>
              <span class="text-xs text-soft"> · ${pay.mode === 'cuotas' ? (pay.installments || []).length + ' cuotas' : 'Pago único'}</span>
            </div>
            <div class="progress-bar"><div class="progress-fill" style="width:${prog}%"></div></div>
            <div class="progress-label"><span>${prog}% cobrado</span>${pay.dueDate ? `<span>Vence ${formatDate(pay.dueDate)}</span>` : ''}</div>
            <div class="flex gap-1 mt-1">
              <button class="btn btn-sm btn-secondary" data-action="edit-payment" data-id="${pay.id}">Editar</button>
              <button class="btn btn-sm btn-ghost" data-action="delete-payment" data-id="${pay.id}">Borrar</button>
            </div>
          </div>`;
      });
      html += `</div>`;
    }
    return html;
  }

              return `<div class="text-xs mt-1">${paid ? '💚 ' + paid + ' pagado(s)' : ''}${pending ? ' · ⏳ ' + pending + ' pendiente(s)' : ''}</div>`;

    const projs = state.projects.filter(p => p.clientId === c.id);
    let html = `

        ${c.notes ? `<p class="text-sm mt-1" style="opacity:0.85">${escapeHtml(c.notes)}</p>` : ''}

      html += `<div class="grid grid-2">`;
      projs.forEach(p => {

        html += `
          <div class="card" data-action="open-project" data-id="${p.id}" style="cursor:pointer">

    } else {
      html += `<div class="grid grid-2">`;
      pays.forEach(pay => {
        const prog = calcPaymentProgress(pay);
        html += `
          <div class="card">
            <div class="card-header">
              <div class="card-title">${escapeHtml(pay.label || 'Pago')}</div>
              ${paymentStatusBadge(pay.status)}
            </div>
            <div class="text-sm"><strong>${formatMoney(pay.paidAmount || 0)}</strong> <span class="text-soft">/ ${formatMoney(pay.totalAmount)}</span>
              · ${pay.mode === 'cuotas' ? 'Cuotas' : 'Único'}</div>
            <div class="progress-bar"><div class="progress-fill" style="width:${prog}%"></div></div>
            <button class="btn btn-sm btn-secondary mt-1" data-action="edit-payment" data-id="${pay.id}">Ver / editar</button>

      html += `</div>`;

  // ========== ESCAPE ==========
  function escapeHtml(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // ========== MAIN RENDER ==========
  function render() {
    const content = document.getElementById('content');
    const title = document.getElementById('page-title');
    const view = state.currentView;

    // Close sidebar on mobile after nav
    document.getElementById('sidebar').classList.remove('open');

    if (view === 'dashboard') {
      title.textContent = 'Inicio';
      content.innerHTML = renderDashboard();
    } else if (view === 'projects') {
      if (state.currentProjectId) {
        const p = state.projects.find(x => x.id === state.currentProjectId);
        title.textContent = p ? p.name : 'Proyecto';
        content.innerHTML = renderProjectDetail(state.currentProjectId);
      } else {
        title.textContent = 'Mis proyectos';
        content.innerHTML = renderProjectsList();
      }
    } else if (view === 'calendar') {
      title.textContent = 'Calendario y tareas';
      content.innerHTML = renderCalendar();
    } else if (view === 'library') {
      title.textContent = 'Biblioteca';
      content.innerHTML = renderLibrary();
    } else if (view === 'templates') {
      title.textContent = 'Plantillas';
      content.innerHTML = renderTemplates();
    } else if (view === 'clients') {
      if (state.currentClientId) {
        const c = state.clients.find(x => x.id === state.currentClientId);
        title.textContent = c ? c.name : 'Cliente';
        content.innerHTML = renderClientDetail(state.currentClientId);
      } else {
        title.textContent = 'Clientes';
        content.innerHTML = renderClients();
      }
    } else if (view === 'payments') {
      title.textContent = 'Pagos';
      content.innerHTML = renderPayments();
    } else if (view === 'budget') {
      title.textContent = 'Presupuesto';
      content.innerHTML = renderBudgetOverview();
    } else if (view === 'settings') {
      title.textContent = 'Configuración';
      content.innerHTML = renderSettings();
    }

    // Bind form submits that were just rendered
    bindDynamicForms();
  }

  function bindDynamicForms() {
    const commercial = document.getElementById('form-commercial');
    if (commercial) {
      commercial.onsubmit = (e) => {
        e.preventDefault();
        const pid = commercial.dataset.project;
        const p = state.projects.find(x => x.id === pid);
        if (!p) return;
        const fd = new FormData(commercial);
        p.commercial = p.commercial || {};
        ['mainImage', 'demoGif', 'presentationEmotes', 'presentationBald', 'presentationOwn',
          'colorPalette', 'backgroundTexture', 'commercialDesc', 'conditions', 'finalFiles', 'publishLink'].forEach(k => {
          p.commercial[k] = fd.get(k) || '';
        });
        p.commercial.price = parseFloat(fd.get('price')) || 0;
        p.commercial.slotsAvailable = parseInt(fd.get('slotsAvailable'), 10) || 0;
        p.updatedAt = new Date().toISOString();
        save();
        toast('Presentación comercial guardada', 'success');
        render();
      };
    }

    const budgetForm = document.getElementById('form-budget');
    if (budgetForm) {
      budgetForm.onsubmit = (e) => {
        e.preventDefault();
        const pid = budgetForm.dataset.project;
        const p = state.projects.find(x => x.id === pid);
        if (!p) return;
        const fd = new FormData(budgetForm);
        p.budget = {
          pricePerPack: parseFloat(fd.get('pricePerPack')) || 0,
          slotsTotal: parseInt(fd.get('slotsTotal'), 10) || 0,
          slotsReserved: parseInt(fd.get('slotsReserved'), 10) || 0,
          slotsSold: parseInt(fd.get('slotsSold'), 10) || 0,
          received: parseFloat(fd.get('received')) || 0,
          expenses: parseFloat(fd.get('expenses')) || 0,
          platformFees: parseFloat(fd.get('platformFees')) || 0,
          paymentFees: parseFloat(fd.get('paymentFees')) || 0
        };
        p.budget.grossEstimated = p.budget.pricePerPack * p.budget.slotsTotal;
        p.budget.netEstimated = p.budget.grossEstimated - p.budget.expenses - p.budget.platformFees - p.budget.paymentFees;
        p.pricePerPack = p.budget.pricePerPack;
        p.slotsTotal = p.budget.slotsTotal;
        p.updatedAt = new Date().toISOString();
        save();
        toast('Presupuesto actualizado', 'success');
        render();
      };
    }

    const notesForm = document.getElementById('form-notes');
    if (notesForm) {
      notesForm.onsubmit = (e) => {
        e.preventDefault();
        const pid = notesForm.dataset.project;
        const p = state.projects.find(x => x.id === pid);
        if (!p) return;
        const fd = new FormData(notesForm);
        p.notes = fd.get('notes') || '';
        p.references = (fd.get('references') || '').split('\n').map(s => s.trim()).filter(Boolean);
        p.updatedAt = new Date().toISOString();
        save();
        toast('Notas guardadas', 'success');
      };
    }

    const settingsForm = document.getElementById('form-settings');
    if (settingsForm) {
      settingsForm.onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(settingsForm);
        state.settings.artistName = fd.get('artistName') || '';
        state.settings.currency = fd.get('currency') || 'USD';
        state.settings.defaultPlatform = fd.get('defaultPlatform') || 'VGen';
        save();
        updateSidebarProfile();
        toast('Configuración guardada', 'success');
      };
    }
  }

  function submitNewProject() {
    const form = document.getElementById('form-new-project');
    if (!form) return;
    const fd = new FormData(form);
    const name = (fd.get('name') || '').trim();
    if (!name) {
      toast('El nombre es obligatorio', 'error');
      return;
    }
    const templateId = fd.get('templateId');
    const tpl = templateId ? state.templates.find(t => t.id === templateId) : null;

    const checklist = (tpl && tpl.presentationTasks && tpl.presentationTasks.length)
      ? tpl.presentationTasks.map(text => ({ id: uid('cl'), text, done: false, notes: '', dueDate: null }))
      : DEFAULT_CHECKLIST.map(text => ({ id: uid('cl'), text, done: false, notes: '', dueDate: null }));

    const price = parseFloat(fd.get('pricePerPack')) || 0;
    const slots = parseInt(fd.get('slotsTotal'), 10) || 0;

    const project = {
      id: uid('proj'),
      name,
      type: fd.get('type') || 'emotes_animadas',
      theme: fd.get('theme') || '',
      description: fd.get('description') || '',
      startDate: fd.get('startDate') || today(),
      targetDate: fd.get('targetDate') || '',
      pricePerPack: price,
      slotsTotal: slots,
      slotsReserved: 0,
      slotsSold: 0,
      platform: fd.get('platform') || 'VGen',
      status: fd.get('status') || 'idea',
      clientId: fd.get('clientId') || null,
      notes: fd.get('notes') || '',
      references: [],
      emotes: [],
      bonuses: [],
      checklist,
      commercial: {
        mainImage: '', demoGif: '', presentationEmotes: '', presentationBald: '', presentationOwn: '',
        colorPalette: '', backgroundTexture: '', commercialDesc: '', price, slotsAvailable: slots,
        conditions: '', finalFiles: '', publishLink: ''
      },
      budget: {
        pricePerPack: price,
        slotsTotal: slots,
        slotsReserved: 0,
        slotsSold: 0,
        grossEstimated: price * slots,
        received: 0,
        expenses: 0,
        platformFees: 0,
        paymentFees: 0,
        netEstimated: price * slots
      },
      templateUsed: templateId || null,
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString()
    };

    state.projects.unshift(project);
    save();
    closeModal();
    state.currentView = 'projects';
    state.currentProjectId = project.id;
    state.projectTab = 'emotes';
    render();
    toast('Proyecto creado ✨', 'success');
  }

  function submitEmote(projectId, emoteId) {
    const form = document.getElementById('form-emote');
    if (!form) return;
    const p = state.projects.find(x => x.id === projectId);
    if (!p) return;
    const fd = new FormData(form);
    const name = (fd.get('name') || '').trim();
    if (!name) {
      toast('El nombre es obligatorio', 'error');
      return;
    }

    const tasksText = (fd.get('tasks') || '').split('\n').map(s => s.trim()).filter(Boolean);
    const existing = emoteId ? (p.emotes || []).find(x => x.id === emoteId) : null;
    const tasks = tasksText.map(text => {
      const prev = existing?.tasks?.find(t => t.text === text);
      return prev || { id: uid('t'), text, done: false };
    });

    const data = {
      name,
      number: parseInt(fd.get('number'), 10) || 0,
      description: fd.get('description') || '',
      type: fd.get('type') || 'animada',
      state: fd.get('state') || 'idea',
      expression: fd.get('expression') || '',
      action: fd.get('action') || '',
      animationDesc: fd.get('animationDesc') || '',
      reference: fd.get('reference') || '',
      notes: fd.get('notes') || '',
      tasks,
      files: existing?.files || [],
      finishedAt: fd.get('finishedAt') || (fd.get('state') === 'terminado' ? today() : null)
    };

    if (emoteId) {
      Object.assign(existing, data);
    } else {
      p.emotes = p.emotes || [];
      p.emotes.push({ id: uid('emote'), ...data });
    }
    p.updatedAt = new Date().toISOString();
    save();
    closeModal();
    render();
    toast(emoteId ? 'Emote actualizada' : 'Emote añadida', 'success');
  }

  // ========== EVENT DELEGATION ==========
  function handleClick(e) {
    const target = e.target.closest('[data-action]');
    if (!target) return;
    const action = target.dataset.action;

    if (action === 'close-modal') {
      closeModal();
      return;
    }

    if (action === 'new-project') {
      showNewProjectModal();
      return;
    }
    if (action === 'submit-new-project') {
      submitNewProject();
      return;
    }
    if (action === 'edit-project') {
      showEditProjectModal(target.dataset.id);
      return;
    }
    if (action === 'submit-edit-project') {
      submitEditProject(target.dataset.id);
      return;
    }
    if (action === 'open-project') {
      state.currentView = 'projects';
      state.currentProjectId = target.dataset.id;
      state.projectTab = 'emotes';
      // Update nav
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.querySelector('.nav-item[data-view="projects"]')?.classList.add('active');
      render();
      return;
    }
    if (action === 'back-to-projects') {
      state.currentProjectId = null;
      render();
      return;
    }
    if (action === 'archive-project') {
      if (!confirmAction('¿Archivar este proyecto? Podrás restaurarlo después.')) return;
      const p = state.projects.find(x => x.id === target.dataset.id);
      if (p) {
        p.status = 'archivado';
        p.updatedAt = new Date().toISOString();
        save();
        if (state.currentProjectId === p.id) state.currentProjectId = null;
        render();
        toast('Proyecto archivado', 'info');
      }
      return;
    }
    if (action === 'unarchive-project') {
      const p = state.projects.find(x => x.id === target.dataset.id);
      if (p) {
        p.status = 'produccion';
        save();
        render();
        toast('Proyecto restaurado', 'success');
      }
      return;
    }
    if (action === 'filter-projects') {
      state.projectFilter = target.dataset.filter;
      render();
      return;
    }
    if (action === 'project-tab') {
      state.projectTab = target.dataset.tab;
      render();
      return;
    }
    if (action === 'filter-emotes') {
      state.emoteFilter = target.dataset.filter;
      render();
      return;
    }
    if (action === 'view-mode') {
      state.emoteViewMode = target.dataset.mode;
      render();
      return;
    }
    if (action === 'add-emote') {
      showEmoteModal(target.dataset.project);
      return;
    }
    if (action === 'edit-emote') {
      showEmoteModal(target.dataset.project, target.dataset.emote);
      return;
    }
    if (action === 'submit-emote') {
      submitEmote(target.dataset.project, target.dataset.emote || null);
      return;
    }
    if (action === 'delete-emote') {
      if (!confirmAction('¿Eliminar esta emote? Esta acción no se puede deshacer.')) return;
      const p = state.projects.find(x => x.id === target.dataset.project);
      if (p) {
        p.emotes = (p.emotes || []).filter(e => e.id !== target.dataset.emote);
        save();
        closeModal();
        render();
        toast('Emote eliminada', 'info');
      }
      return;
    }
    if (action === 'change-emote-state') {
      // handled by change event
      return;
    }
    if (action === 'toggle-checklist') {
      const p = state.projects.find(x => x.id === target.dataset.project);
      if (!p) return;
      const item = (p.checklist || []).find(i => i.id === target.dataset.item);
      if (item) {
        item.done = !item.done;
        p.updatedAt = new Date().toISOString();
        save();
        render();
      }
      return;
    }
    if (action === 'add-checklist-item') {
      const text = prompt('Texto de la nueva tarea:');
      if (!text || !text.trim()) return;
      const p = state.projects.find(x => x.id === target.dataset.project);
      if (p) {
        p.checklist = p.checklist || [];
        p.checklist.push({ id: uid('cl'), text: text.trim(), done: false, notes: '', dueDate: null });
        save();
        render();
        toast('Tarea añadida', 'success');
      }
      return;
    }
    if (action === 'edit-checklist-item') {
      const p = state.projects.find(x => x.id === target.dataset.project);
      if (!p) return;
      const item = (p.checklist || []).find(i => i.id === target.dataset.item);
      if (!item) return;
      const text = prompt('Editar tarea:', item.text);
      if (text == null) return;
      item.text = text.trim() || item.text;
      save();
      render();
      return;
    }
    if (action === 'add-bonus') {
      showBonusModal(target.dataset.project);
      return;
    }
    if (action === 'edit-bonus') {
      showBonusModal(target.dataset.project, target.dataset.bonus);
      return;
    }
    if (action === 'submit-bonus') {
      submitBonus(target.dataset.project, target.dataset.bonus || null);
      return;
    }
    if (action === 'delete-bonus') {
      if (!confirmAction('¿Eliminar este bonus?')) return;
      const p = state.projects.find(x => x.id === target.dataset.project);
      if (p) {
        p.bonuses = (p.bonuses || []).filter(b => b.id !== target.dataset.bonus);
        save();
        closeModal();
        render();
        toast('Bonus eliminado', 'info');
      }
      return;
    }
    if (action === 'add-resource') {
      showResourceModal();
      return;
    }
    if (action === 'edit-resource') {
      showResourceModal(target.dataset.id);
      return;
    }
    if (action === 'submit-resource') {
      submitResource(target.dataset.id || null);
      return;
    }
    if (action === 'delete-resource') {
      if (!confirmAction('¿Eliminar este recurso?')) return;
      state.resources = state.resources.filter(r => r.id !== target.dataset.id);
      save();
      render();
      toast('Recurso eliminado', 'info');
      return;
    }
    if (action === 'add-template') {
      const name = prompt('Nombre de la plantilla:');
      if (!name || !name.trim()) return;
      state.templates.push({
        id: uid('tpl'),
        name: name.trim(),
        phases: EMOTE_STATES.map(s => s.id),
        tasks: ['Boceto', 'Lineart', 'Color', 'Animación', 'Exportación'],
        exportRequirements: '',
        materials: '',
        presentationTasks: [...DEFAULT_CHECKLIST],
        customFields: []
      });
      save();
      render();
      toast('Plantilla creada', 'success');
      return;
    }
    if (action === 'use-template') {
      showNewProjectModal(target.dataset.id);
      return;
    }
    if (action === 'edit-template') {
      const t = state.templates.find(x => x.id === target.dataset.id);
      if (!t) return;
      const name = prompt('Nombre de la plantilla:', t.name);
      if (name == null) return;
      t.name = name.trim() || t.name;
      save();
      render();
      toast('Plantilla actualizada', 'success');
      return;
    }
    if (action === 'delete-template') {
      if (!confirmAction('¿Eliminar esta plantilla?')) return;
      state.templates = state.templates.filter(t => t.id !== target.dataset.id);
      save();
      render();
      toast('Plantilla eliminada', 'info');
      return;
    }
    if (action === 'save-checklist-as-template') {
      const p = state.projects.find(x => x.id === target.dataset.project);
      if (!p) return;
      const name = prompt('Nombre para la plantilla de checklist:', `Checklist · ${p.name}`);
      if (!name) return;
      state.templates.push({
        id: uid('tpl'),
        name: name.trim(),
        phases: EMOTE_STATES.map(s => s.id),
        tasks: [],
        exportRequirements: '',
        materials: '',
        presentationTasks: (p.checklist || []).map(c => c.text),
        customFields: []
      });
      save();
      toast('Checklist guardada como plantilla', 'success');
      return;
    }

    if (action === 'add-payment' || action === 'edit-payment') {
      const existing = action === 'edit-payment' ? state.payments.find(x => x.id === target.dataset.id) : null;
      const preClient = target.dataset.client || existing?.clientId || '';
      const body = `
        <form id="form-payment">
          <div class="form-group">
            <label>Concepto / etiqueta <span class="required">*</span></label>
            <input type="text" name="label" required value="${escapeHtml(existing?.label || '')}" placeholder="Pack emotes, anticipo, saldo..." />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Cliente</label>
              <select name="clientId">
                <option value="">— Sin cliente —</option>
                ${(state.clients || []).map(c => `<option value="${c.id}" ${(preClient === c.id) ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('')}
              </select>
            </div>
            <div class="form-group">
              <label>Proyecto (opcional)</label>
              <select name="projectId">
                <option value="">— Ninguno —</option>
                ${state.projects.map(pr => `<option value="${pr.id}" ${existing?.projectId === pr.id ? 'selected' : ''}>${escapeHtml(pr.name)}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Monto total</label>
              <input type="number" name="totalAmount" step="0.01" value="${existing?.totalAmount ?? ''}" />
            </div>
            <div class="form-group">
              <label>Ya cobrado</label>
              <input type="number" name="paidAmount" step="0.01" value="${existing?.paidAmount ?? 0}" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Modo de pago</label>
              <select name="mode" id="payment-mode-select">
                <option value="unico" ${(!existing || existing.mode === 'unico') ? 'selected' : ''}>Pago único</option>
                <option value="cuotas" ${existing?.mode === 'cuotas' ? 'selected' : ''}>En cuotas</option>
              </select>
            </div>
            <div class="form-group">
              <label>Estado</label>
              <select name="status">
                ${PAYMENT_STATUSES.map(s => `<option value="${s.id}" ${existing?.status === s.id ? 'selected' : ''}>${s.label}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="form-group" id="field-due-unico">
            <label>Fecha de vencimiento (pago único)</label>
            <input type="date" name="dueDate" value="${existing?.dueDate || ''}" />
            <div class="form-hint">Se mostrará en recordatorios si aún no está pagado.</div>
          </div>
          <div class="form-group">
            <label>Cuotas (si aplica)</label>
            <div class="form-hint mb-1">Una por línea: monto | fecha (YYYY-MM-DD) | pagado(si/no). Ejemplo: 50 | 2026-11-01 | no</div>
            <textarea name="installmentsText" rows="4" placeholder="50 | 2026-11-01 | no&#10;50 | 2026-12-01 | no">${escapeHtml((existing?.installments || []).map(i => `${i.amount} | ${i.dueDate || ''} | ${i.paid ? 'si' : 'no'}`).join('\n'))}</textarea>
          </div>
          <div class="form-group">
            <label>Notas / recordatorio</label>
            <textarea name="notes" rows="2" placeholder="Mensaje para recordarle al cliente...">${escapeHtml(existing?.notes || '')}</textarea>
          </div>
        </form>`;
      const footer = `
        <button class="btn btn-ghost" data-action="close-modal">Cancelar</button>
        ${existing ? `<button class="btn btn-danger" data-action="delete-payment" data-id="${existing.id}">Eliminar</button>` : ''}
        <button class="btn btn-primary" data-action="submit-payment" data-id="${existing?.id || ''}">${existing ? 'Guardar' : 'Registrar'}</button>`;
      openModal(existing ? 'Editar pago' : 'Registrar pago', body, footer, true);
      return;
    }
    if (action === 'submit-payment') {
      const form = document.getElementById('form-payment');
      if (!form) return;
      const fd = new FormData(form);
      const label = (fd.get('label') || '').trim();
      if (!label) return toast('El concepto es obligatorio', 'error');
      const instText = (fd.get('installmentsText') || '').split('\n').map(s => s.trim()).filter(Boolean);
      const installments = instText.map(line => {
        const parts = line.split('|').map(x => x.trim());
        return {
          amount: parseFloat(parts[0]) || 0,
          dueDate: parts[1] || '',
          paid: /^(si|sí|yes|1|true|pagado)$/i.test(parts[2] || '')
        };
      });
      const totalAmount = parseFloat(fd.get('totalAmount')) || 0;
      let paidAmount = parseFloat(fd.get('paidAmount')) || 0;
      const mode = fd.get('mode') || 'unico';
      if (mode === 'cuotas' && installments.length) {
        paidAmount = installments.filter(i => i.paid).reduce((a, i) => a + (i.amount || 0), 0);
      }
      let status = fd.get('status') || 'pendiente';
      if (totalAmount > 0 && paidAmount >= totalAmount) status = 'pagado';
      else if (paidAmount > 0 && status === 'pendiente') status = 'parcial';

      const data = {
        label,
        clientId: fd.get('clientId') || null,
        projectId: fd.get('projectId') || null,
        totalAmount,
        paidAmount,
        mode,
        status,
        dueDate: fd.get('dueDate') || '',
        installments,
        notes: fd.get('notes') || '',
        updatedAt: new Date().toISOString()
      };
      const id = target.dataset.id;
      if (id) {
        const pay = state.payments.find(x => x.id === id);
        if (pay) Object.assign(pay, data);
      } else {
        state.payments.push({ id: uid('pay'), ...data, createdAt: new Date().toISOString() });
      }
      save();
      closeModal();
      render();
      toast(id ? 'Pago actualizado' : 'Pago registrado', 'success');
      return;
    }
    if (action === 'delete-payment') {
      if (!confirmAction('¿Eliminar este registro de pago?')) return;
      state.payments = state.payments.filter(x => x.id !== target.dataset.id);
      save();
      closeModal();
      render();
      toast('Pago eliminado', 'info');
      return;
    }
    if (action === 'filter-payments') {
      state.paymentFilter = target.dataset.filter;
      render();
      return;
    }
    if (action === 'mark-installment-paid') {
      const pay = state.payments.find(x => x.id === target.dataset.id);
      if (!pay) return;
      const idx = target.dataset.idx;
      if (idx !== '' && idx != null && pay.installments && pay.installments[idx]) {
        pay.installments[idx].paid = true;
        pay.paidAmount = pay.installments.filter(i => i.paid).reduce((a, i) => a + (i.amount || 0), 0);
      } else if (pay.mode === 'unico') {
        pay.paidAmount = pay.totalAmount;
      }
      if (pay.totalAmount > 0 && pay.paidAmount >= pay.totalAmount) pay.status = 'pagado';
      else if (pay.paidAmount > 0) pay.status = 'parcial';
      pay.updatedAt = new Date().toISOString();
      save();
      render();
      toast('Marcado como cobrado 💚', 'success');
      return;
    }
    if (action === 'add-client' || action === 'edit-client') {
      const existing = action === 'edit-client' ? state.clients.find(x => x.id === target.dataset.id) : null;
      const body = `
        <form id="form-client">
          <div class="form-group">
            <label>Nombre <span class="required">*</span></label>
            <input type="text" name="name" required value="${escapeHtml(existing?.name || '')}" placeholder="Nombre del cliente o VTuber" />
          </div>
          <div class="form-group">
            <label>Contacto</label>
            <input type="text" name="contact" value="${escapeHtml(existing?.contact || '')}" placeholder="Discord, email, Twitter..." />
          </div>
          <div class="form-group">
            <label>Emoji / icono</label>
            <input type="text" name="emoji" value="${escapeHtml(existing?.emoji || '👤')}" maxlength="4" style="width:5rem" />
          </div>
          <div class="form-group">
            <label>Notas</label>
            <textarea name="notes" rows="3" placeholder="Preferencias, plazos, estilo...">${escapeHtml(existing?.notes || '')}</textarea>
          </div>
        </form>`;
      const footer = `
        <button class="btn btn-ghost" data-action="close-modal">Cancelar</button>
        ${existing ? `<button class="btn btn-danger" data-action="delete-client" data-id="${existing.id}">Eliminar</button>` : ''}
        <button class="btn btn-primary" data-action="submit-client" data-id="${existing?.id || ''}">${existing ? 'Guardar' : 'Crear'}</button>`;
      openModal(existing ? 'Editar cliente' : 'Nuevo cliente', body, footer);
      return;
    }
    if (action === 'submit-client') {
      const form = document.getElementById('form-client');
      if (!form) return;
      const fd = new FormData(form);
      const name = (fd.get('name') || '').trim();
      if (!name) return toast('El nombre es obligatorio', 'error');
      const data = {
        name,
        contact: fd.get('contact') || '',
        emoji: (fd.get('emoji') || '👤').trim() || '👤',
        notes: fd.get('notes') || ''
      };
      const id = target.dataset.id;
      if (id) {
        const c = state.clients.find(x => x.id === id);
        if (c) Object.assign(c, data);
      } else {
        state.clients.push({ id: uid('client'), ...data, createdAt: new Date().toISOString() });
      }
      save();
      closeModal();
      render();
      toast(id ? 'Cliente actualizado' : 'Cliente creado', 'success');
      return;
    }
    if (action === 'delete-client') {
      if (!confirmAction('¿Eliminar este cliente? Los proyectos no se borran, solo se desvinculan.')) return;
      const id = target.dataset.id;
      state.clients = state.clients.filter(c => c.id !== id);
      state.projects.forEach(p => { if (p.clientId === id) p.clientId = null; });
      if (state.currentClientId === id) state.currentClientId = null;
      save();
      closeModal();
      render();
      toast('Cliente eliminado', 'info');
      return;
    }
    if (action === 'open-client') {
      state.currentView = 'clients';
      state.currentClientId = target.dataset.id;
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.querySelector('.nav-item[data-view="clients"]')?.classList.add('active');
      render();
      return;
    }
    if (action === 'back-to-clients') {
      state.currentClientId = null;
      render();
      return;
    }
    if (action === 'new-project-for-client') {
      showNewProjectModal();
      // preselect client after modal opens
      setTimeout(() => {
        const sel = document.querySelector('#form-new-project select[name="clientId"]');
        if (sel) sel.value = target.dataset.client;
      }, 50);
      return;
    }
    if (action === 'remove-profile-photo') {
      state.settings.profilePhoto = '';
      save();
      updateSidebarProfile();
      render();
      toast('Foto eliminada', 'info');
      return;
    }
    if (action === 'export-json') {
      exportJSON();
      return;
    }
    if (action === 'reset-data') {
      if (!confirmAction('¿Borrar TODOS los datos de Hana’s Emote Studio? Esta acción no se puede deshacer desde la app.')) return;
      if (!confirmAction('Última confirmación: se eliminarán proyectos, plantillas y recursos.')) return;
      localStorage.removeItem(STORAGE_KEY);
      state.projects = [];
      state.templates = [DEFAULT_TEMPLATE];
      state.resources = [];
      state.clients = [];
      state.payments = [];
      state.settings.profilePhoto = '';
      seedExampleProject();
      save();
      state.currentProjectId = null;
      state.currentView = 'dashboard';
      render();
      toast('Datos restablecidos con el proyecto de ejemplo', 'info');
      return;
    }
  }

  function handleChange(e) {
    const target = e.target;
    if (target.dataset.action === 'change-emote-state') {
      const p = state.projects.find(x => x.id === target.dataset.project);
      if (!p) return;
      const emote = (p.emotes || []).find(e => e.id === target.dataset.emote);
      if (!emote) return;
      emote.state = target.value;
      if (target.value === 'terminado' && !emote.finishedAt) {
        emote.finishedAt = today();
      }
      p.updatedAt = new Date().toISOString();
      save();
      render();
      toast(`Estado: ${EMOTE_STATES.find(s => s.id === target.value)?.label || target.value}`, 'success');
      return;
    }
    if (target.dataset.action === 'search-projects') {
      state.projectSearch = target.value;
      // debounce-ish
      clearTimeout(window._searchTimer);
      window._searchTimer = setTimeout(() => render(), 200);
      return;
    }
    if (target.dataset.action === 'import-json' && target.files?.[0]) {
      importJSON(target.files[0]);
      target.value = '';
    }
    if (target.dataset.action === 'change-project-status') {
      const proj = state.projects.find(x => x.id === target.dataset.id);
      if (!proj) return;
      proj.status = target.value;
      proj.updatedAt = new Date().toISOString();
      save();
      render();
      toast('Estado: ' + (PROJECT_STATES.find(s => s.id === target.value)?.label || target.value), 'success');
      return;
    }
    if (target.dataset.action === 'search-clients') {
      state.clientSearch = target.value;
      clearTimeout(window._searchTimer);
      window._searchTimer = setTimeout(() => render(), 200);
      return;
    }
    if (target.dataset.action === 'upload-profile-photo' && target.files?.[0]) {
      const file = target.files[0];
      if (file.size > 800 * 1024) {
        toast('La imagen es muy grande (máx. ~800 KB). Comprime un poco.', 'error');
        target.value = '';
        return;
      }
      const reader = new FileReader();
      reader.onload = (ev) => {
        state.settings.profilePhoto = ev.target.result;
        save();
        updateSidebarProfile();
        render();
        toast('Foto de perfil actualizada ✨', 'success');
      };
      reader.readAsDataURL(file);
      target.value = '';
      return;
    }
  }

  function handleNav(e) {
    const btn = e.target.closest('.nav-item');
    if (!btn) return;
    const view = btn.dataset.view;
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    btn.classList.add('active');
    state.currentView = view;
    state.currentProjectId = null;
    state.currentClientId = null;
    state.projectTab = 'emotes';
    render();
  }

  // ========== INIT ==========
  function updateSidebarProfile() {
    const mark = document.querySelector('.logo-mark');
    if (!mark) return;
    const photo = state.settings.profilePhoto;
    if (photo) {
      mark.innerHTML = `<img src="${photo}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit" />`;
      mark.style.padding = '0';
      mark.style.overflow = 'hidden';
    } else {
      mark.textContent = '🪼';
      mark.style.padding = '';
    }
  }

  function init() {
    load();
    updateSidebarProfile();
    render();

    // document-level so modal buttons (outside #app) also work
    document.addEventListener('click', handleClick);
    document.addEventListener('change', handleChange);
    document.querySelector('.nav').addEventListener('click', handleNav);

    document.getElementById('btn-new-project').addEventListener('click', () => showNewProjectModal());
    document.getElementById('btn-close-modal').addEventListener('click', closeModal);
    document.getElementById('modal-overlay').addEventListener('click', (e) => {
      if (e.target.id === 'modal-overlay') closeModal();
    });

    document.getElementById('btn-menu').addEventListener('click', () => {
      document.getElementById('sidebar').classList.add('open');
    });
    document.getElementById('btn-close-sidebar').addEventListener('click', () => {
      document.getElementById('sidebar').classList.remove('open');
    });

    // Keyboard
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });
  }

  init();
})();

</script>
</body>
</html>
